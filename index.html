    .cat-bar::-webkit-scrollbar{width:4px} .cat-bar::-webkit-scrollbar-thumb{background:rgba(229,255,0,0.5);border-radius:999px}
    .cat-option{flex:none;min-width:0;padding:12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);cursor:pointer;text-align:left;transition:all 0.2s;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
    .cat-option:active{transform:scale(0.97)}
    .cat-option.sel{background:#E5FF00;color:black;border-color:#E5FF00;box-shadow:0 4px 18px rgba(229,255,0,0.3)}
    .cat-option .cn{font-size:12px;font-weight:900;line-height:1.1} .cat-option .cp{font-size:12px;font-weight:800;margin-top:4px} .cat-option .cd{font-size:10px;opacity:0.75;margin-top:3px;line-height:1.2}
    @media(max-width:380px){.cat-bar{grid-template-columns:1fr;max-height:320px}}`;
    document.head.appendChild(s);
  }
  var catDefs=[
    {id:'vip',name:'VIP',badge:'★ TOP',mult:1.8},
    {id:'gramilla1',name:'Gramilla 1',mult:1.3},
    {id:'gramilla2',name:'Gramilla 2',mult:1.0},
    {id:'gramilla3',name:'Gramilla 3',mult:0.85},
    {id:'general',name:'General',mult:0.6},
    {id:'palco',name:'Palco',mult:1.6},
    {id:'palco1',name:'Palco 1',badge:'★ PREMIUM',mult:1.7},
    {id:'palco2',name:'Palco 2',mult:1.6},
    {id:'palco3',name:'Palco 3',mult:1.5},
    {id:'palco4',name:'Palco 4',mult:1.4},
  ];
  window.__getAdminCategories=function(base){
    return catDefs.map(function(d){
      var p=document.getElementById('admin-cat-price-'+d.id);
      var st=document.getElementById('admin-cat-stock-'+d.id);
      return {id:d.id,name:d.name,price:p?parseInt(p.value)||Math.round(base*d.mult):Math.round(base*d.mult),stock:st?parseInt(st.value)||100:100,desc:d.id==='vip'?'Primera fila + exclusiva':d.id.startsWith('palco')?d.name+' - Zona elevada con servicio':d.name,badge:d.badge||null,color:d.id==='vip'?'#E5FF00':d.id.includes('palco')?'#FFD700':'#FFF'};
    });
  };
  // Observer categorias UI en modal evento
  var obs=new MutationObserver(function(){
    document.querySelectorAll('div[class*="fixed"][class*="z-"]').forEach(function(modal){
      if(modal.querySelector('.cat-bar')) return;
      var hasEvent=modal.innerHTML.includes('Bogotá')||modal.innerHTML.includes('Medellín')||modal.innerHTML.includes('Festival')||modal.innerHTML.includes('Baum');
      if(!hasEvent) return;
      try{
        var events=JSON.parse(localStorage.getItem('checking_events')||'[]');
        var ev=null; for(var i=0;i<events.length;i++){ if(modal.innerHTML.includes(events[i].title.substring(0,15))){ ev=events[i]; break; } }
        if(!ev||!ev.ticketCategories) return;
        var bar=document.createElement('div'); bar.className='cat-bar';
        bar.innerHTML='<div style="width:100%;font-size:10px;letter-spacing:1.5px;opacity:0.5;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center" class="mono"><span>ELIGE TU CATEGORÍA — DESLIZA ↕</span><span style="font-size:9px;background:rgba(229,255,0,0.15);padding:2px 6px;border-radius:999px">'+ev.ticketCategories.length+' OPCIONES</span></div>';
        ev.ticketCategories.forEach(function(cat){
          var opt=document.createElement('button'); opt.className='cat-option'+(cat.id==='general'?' sel':'');
          opt.innerHTML='<div class="cn">'+cat.name+' '+(cat.badge||'')+'</div><div class="cp">'+fmt(cat.price)+'</div><div class="cd">'+cat.desc+'</div><div class="mono" style="font-size:9px;margin-top:4px;opacity:0.5">Stock:'+cat.stock+'</div>';
          opt.onclick=function(){ 
            bar.querySelectorAll('.cat-option').forEach(function(o){o.classList.remove('sel')}); 
            opt.classList.add('sel'); 
            window.__selectedCategory=cat; 
            // Feedback táctil
            if(navigator.vibrate) try{navigator.vibrate(30);}catch(e){}
            // Auto scroll suave hacia el botón de carrito para continuar al flujo de compra
            setTimeout(function(){
              var buyBtn=bar.parentNode ? bar.parentNode.querySelector('button[class*="bg-[#E5FF00]"]') : null;
              if(buyBtn){ buyBtn.scrollIntoView({behavior:'smooth', block:'center'}); buyBtn.style.transform='scale(1.03)'; setTimeout(function(){buyBtn.style.transform='';},300); }
            },150);
          };
          bar.appendChild(opt);
        });
        var btnArea=modal.querySelector('button[class*="bg-[#E5FF00]"]');
        if(btnArea&&btnArea.parentNode) btnArea.parentNode.insertBefore(bar, btnArea);
        window.__selectedCategory=ev.ticketCategories.find(function(c){return c.id==='general'});
      }catch(e){}
    });
  }); obs.observe(document.body,{childList:true,subtree:true});

  // Admin editor
  var obs2=new MutationObserver(function(){
    if(localStorage.getItem('checking_admin')!=='true') return;
    if(document.getElementById('admin-cats-section')) return;
    document.querySelectorAll('form, div[class*="rounded-[28px]"]').forEach(function(form){
      if(form.dataset.catAdminInjected) return;
      if(form.innerHTML.includes('Nequi')||form.innerHTML.includes('DaviPlata')) return;
      var priceInput=form.querySelector('input[type="number"]');
      if(!priceInput) return;
      var hasTitle=form.innerHTML.includes('Título')||form.innerHTML.includes('Crear Evento')||form.innerHTML.includes('Venue');
      if(!hasTitle && !form.innerHTML.includes('location')) return;
      var section=document.createElement('div'); section.id='admin-cats-section';
      section.className='mt-6 rounded-[20px] border border-[#E5FF00]/20 bg-[#E5FF00]/[0.06] p-5';
      section.innerHTML=`<div class="flex items-center gap-2 mb-4"><div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#E5FF00] text-black font-black text-[12px]">★</div><div><div class="text-[14px] font-black">Precios por Categoría - Admin</div><div class="mono text-[10px] text-white/40">Solo administrador</div></div></div><div class="grid grid-cols-1 gap-2" id="admin-cats-grid"></div>`;
      var grid=section.querySelector('#admin-cats-grid');
      setTimeout(function(){
        var base=parseInt(priceInput.value)||100000;
        catDefs.forEach(function(def){
          var row=document.createElement('div'); row.className='flex items-center gap-3 rounded-[12px] bg-[#0A0A0A] border border-white/10 p-3';
          row.innerHTML=`<div class="flex-1"><div class="text-[13px] font-black">${def.name} ${def.badge||''}</div><div class="mono text-[10px] text-white/40">x${def.mult}</div></div><div class="flex gap-2"><div><div class="mono text-[9px] text-white/30">PRECIO</div><input id="admin-cat-price-${def.id}" type="number" value="${Math.round(base*def.mult)}" class="w-[110px] rounded-full bg-white/[0.06] border border-white/10 px-3 py-2 text-[13px] font-bold outline-none"></div><div><div class="mono text-[9px] text-white/30">STOCK</div><input id="admin-cat-stock-${def.id}" type="number" value="${def.id==='vip'?50:def.id==='general'?500:def.id==='palco'?80:150}" class="w-[70px] rounded-full bg-white/[0.06] border border-white/10 px-3 py-2 text-[13px] font-bold"></div></div>`;
          grid.appendChild(row);
        });
      },100);
      if(priceInput.parentNode&&priceInput.parentNode.parentNode){
        priceInput.parentNode.parentNode.parentNode.insertBefore(section, priceInput.parentNode.parentNode.nextSibling);
        form.dataset.catAdminInjected='true';
      }
    });
  }); obs2.observe(document.body,{childList:true,subtree:true});

  document.addEventListener('submit',function(e){
    if(document.getElementById('admin-cats-section')){
      var base=document.querySelector('input[type="number"]'); var bp=base?parseInt(base.value)||100000:100000;
      sessionStorage.setItem('_adminCats', JSON.stringify(window.__getAdminCategories(bp)));
    }
  },true);
})();
</script>

<script>
// === QR GENERACION + HISTORIAL VALIDACIONES (SOLO ADMIN) ===
(function(){
  window.__generateQRData=function(ticket){
    var payload={v:2,id:ticket.id,eid:ticket.eventId,evt:(ticket.eventTitle||'').substring(0,30),cat:ticket.ticketCategory||'general',price:ticket.price,att:ticket.attendee?.name||'',order:ticket.orderId||'',date:ticket.createdAt||new Date().toISOString(),chk:btoa((ticket.id||'')+'|'+(ticket.eventId||'')).substring(0,16)};
    return 'CHECKING://TICKET/'+payload.id+'?d='+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  };
  window.__generateQRText=function(t){ return `TICKET:${t.id}\nEVENTO:${t.eventTitle} - ${t.ticketCategory}\nTITULAR:${t.attendee?.name}\nORDEN:${t.orderId}`; };
  window.__createQR=function(container,ticket){
    if(!container||container.dataset.qrGenerated) return;
    container.dataset.qrGenerated='true'; container.innerHTML='';
    try{ new QRCode(container,{text:window.__generateQRData(ticket),width:180,height:180,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H}); var l=document.createElement('div'); l.className='mono text-[9px] text-center mt-2 text-black/60'; l.textContent=ticket.id; container.appendChild(l);}catch(e){ container.innerHTML='<div class="text-[10px] text-red-500">Error QR</div>'; }
  };

  // Historial validaciones
  window.__getValidationHistory=function(){
    try{ return JSON.parse(localStorage.getItem('checking_validation_history')||'[]'); }catch(e){ return []; }
  };
  window.__saveValidationHistory=function(entry){
    try{
      var hist=window.__getValidationHistory();
      hist.unshift(entry);
      if(hist.length>500) hist=hist.slice(0,500);
      localStorage.setItem('checking_validation_history', JSON.stringify(hist));
    }catch(e){}
  };

  // Observer para QR en tickets
  var qrObs=new MutationObserver(function(){
    document.querySelectorAll('*').forEach(function(el){
      if(!el.textContent||!el.textContent.includes('CHK-')) return;
      if(el.children.length>10) return;
      var m=el.textContent.match(/CHK-[A-Z0-9\-]+/); if(!m) return;
      var tid=m[0];
      try{
        var tickets=JSON.parse(localStorage.getItem('checking_tickets')||'[]');
        var orders=JSON.parse(localStorage.getItem('checking_orders')||'[]');
        var ticket=tickets.find(function(t){return t.id===tid});
        if(!ticket){ for(var i=0;i<orders.length;i++){ var f=(orders[i].tickets||[]).find(function(t){return t.id===tid}); if(f){ticket=f;break;} } }
        if(!ticket) return;
        var parent=el.closest('div[class*="bg-white"], div[class*="rounded-[20px]"], div[class*="border"]')||el.parentNode;
        if(!parent||parent.querySelector('.qr-container-'+tid.replace(/[^a-zA-Z0-9]/g,''))) return;
        var wrap=document.createElement('div');
        wrap.className='qr-container-'+tid.replace(/[^a-zA-Z0-9]/g,'')+' mt-3 flex flex-col items-center rounded-[16px] bg-white p-3 border border-black/10';
        wrap.innerHTML=`<div class="mono text-[10px] font-black mb-2 text-black">QR - ${ticket.ticketCategory||'GENERAL'}</div><div class="qr-code-target bg-white p-2 rounded-[8px]" style="width:196px;height:216px;display:flex;flex-direction:column;align-items:center;justify-content:center"></div><div class="mt-2 text-[10px] text-black/50 mono text-center"><div>${ticket.eventTitle||''}</div><div class="font-bold text-black">${ticket.attendee?.name||''}</div></div>`;
        parent.appendChild(wrap);
        window.__createQR(wrap.querySelector('.qr-code-target'), ticket);
      }catch(e){}
    });
  }); qrObs.observe(document.body,{childList:true,subtree:true});

  // Parchear localStorage para QR
  var orig=localStorage.setItem;
  localStorage.setItem=function(k,v){
    if(k==='checking_tickets'){
      try{
        var data=JSON.parse(v);
        data=data.map(function(t){ if(!t.qrData){ t.qrData=window.__generateQRData(t); t.qrHash=btoa(t.id+'|'+Date.now()).substring(0,24); } return t; });
        v=JSON.stringify(data);
      }catch(e){}
    }
    return orig.call(this,k,v);
  };

  // Modal scanner + historial
  function createModals(){
    if(document.getElementById('admin-qr-scanner-modal')) return;
    var modal=document.createElement('div');
    modal.id='admin-qr-scanner-modal';
    modal.style.cssText='display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML=`
      <div style="width:100%;max-width:460px;max-height:90vh;overflow-y:auto;background:#141414;border:1px solid rgba(255,255,255,0.1);border-radius:28px">
        <div style="padding:20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#141414;z-index:10;border-radius:28px 28px 0 0">
          <div><div style="font-size:18px;font-weight:900;color:white">Escáner QR - Admin</div><div class="mono" style="font-size:10px;color:rgba(255,255,255,0.4)">SOLO ADMIN • Cámara + Historial</div></div>
          <button id="close-scanner" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;cursor:pointer">✕</button>
        </div>
        <div style="padding:20px">
          <div id="qr-reader" style="width:100%;border-radius:16px;overflow:hidden;background:#000"></div>
          <div id="qr-result" style="margin-top:16px;padding:16px;border-radius:16px;background:rgba(229,255,0,0.1);border:1px solid rgba(229,255,0,0.2);display:none"><div id="qr-result-content" style="color:white;font-size:13px"></div></div>
          <div style="margin-top:16px;display:flex;gap:8px">
            <button id="start-scan-btn" style="flex:1;padding:12px;border-radius:999px;background:#E5FF00;color:black;font-weight:900;font-size:13px;border:none;cursor:pointer">Iniciar Cámara</button>
            <button id="stop-scan-btn" style="flex:1;padding:12px;border-radius:999px;background:rgba(255,255,255,0.1);color:white;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;display:none">Detener</button>
          </div>
          <div style="margin-top:20px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <div style="font-size:12px;font-weight:900;color:white">📋 Historial Validaciones</div>
              <button id="clear-history" style="font-size:10px;padding:4px 8px;border-radius:999px;background:rgba(255,59,48,0.15);border:1px solid rgba(255,59,48,0.2);color:#FF3B30;cursor:pointer">Limpiar</button>
            </div>
            <div id="validation-history" style="max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.3);border-radius:12px;padding:8px;border:1px solid rgba(255,255,255,0.06)"></div>
          </div>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#close-scanner').onclick=function(){ stopScanner(); modal.style.display='none'; };
    modal.onclick=function(e){ if(e.target===modal){ stopScanner(); modal.style.display='none'; } };
    document.getElementById('start-scan-btn').onclick=startScanner;
    document.getElementById('stop-scan-btn').onclick=stopScanner;
    document.getElementById('clear-history').onclick=function(){ if(confirm('¿Borrar historial de validaciones?')){ localStorage.removeItem('checking_validation_history'); renderHistory(); } };

    // Modal historial completo
    var histModal=document.createElement('div');
    histModal.id='admin-history-modal';
    histModal.style.cssText='display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;';
    histModal.innerHTML=`
      <div style="width:100%;max-width:600px;max-height:85vh;overflow-y:auto;background:#141414;border:1px solid rgba(255,255,255,0.1);border-radius:28px">
        <div style="padding:20px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#141414;z-index:10">
          <div><div style="font-size:18px;font-weight:900;color:white">Historial Completo Validaciones</div><div class="mono" style="font-size:10px;color:rgba(255,255,255,0.4)">SOLO ADMIN</div></div>
          <button id="close-history" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;cursor:pointer">✕</button>
        </div>
        <div style="padding:20px">
          <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
            <div id="history-stats" style="flex:1;min-width:140px;background:rgba(229,255,0,0.1);border:1px solid rgba(229,255,0,0.2);border-radius:12px;padding:12px"></div>
            <button id="export-history" style="padding:10px 16px;border-radius:999px;background:white;color:black;font-weight:900;font-size:12px;border:none;cursor:pointer">📥 Exportar CSV</button>
          </div>
          <div id="full-history-list" style="display:flex;flex-direction:column;gap:8px"></div>
        </div>
      </div>`;
    document.body.appendChild(histModal);
    histModal.querySelector('#close-history').onclick=function(){ histModal.style.display='none'; };
    histModal.onclick=function(e){ if(e.target===histModal) histModal.style.display='none'; };
    document.getElementById('export-history').onclick=exportHistory;
  }

  function renderHistory(){
    var cont=document.getElementById('validation-history');
    var fullCont=document.getElementById('full-history-list');
    var statsCont=document.getElementById('history-stats');
    if(!cont) return;
    var hist=window.__getValidationHistory();
    if(hist.length===0){
      cont.innerHTML='<div class="mono text-[11px] text-white/30 text-center py-4">Sin validaciones aún</div>';
      if(fullCont) fullCont.innerHTML='<div class="mono text-[11px] text-white/30 text-center py-8">Sin validaciones</div>';
      if(statsCont) statsCont.innerHTML='<div class="mono text-[10px] text-white/40">Total: 0</div>';
      return;
    }
    cont.innerHTML=hist.slice(0,10).map(function(h){
      var d=new Date(h.timestamp);
      return `<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:11px">
        <div style="display:flex;justify-content:space-between"><span style="font-weight:900;color:white">${h.ticketId}</span><span class="mono" style="font-size:9px;color:rgba(255,255,255,0.4)">${d.toLocaleTimeString('es-CO')}</span></div>
        <div style="color:rgba(255,255,255,0.7)">${h.eventTitle} • ${h.category}</div>
        <div style="color:rgba(255,255,255,0.5)">Titular: ${h.attendeeName}</div>
        <div style="margin-top:4px"><span style="background:${h.wasAlreadyValidated?'rgba(255,59,48,0.2)':'rgba(0,200,83,0.2)'};color:${h.wasAlreadyValidated?'#FF3B30':'#00C853'};padding:2px 6px;border-radius:999px;font-size:9px;font-weight:900">${h.wasAlreadyValidated?'YA VALIDADO':'VALIDADO'}</span></div>
      </div>`;
    }).join('');

    if(fullCont){
      fullCont.innerHTML=hist.map(function(h){
        var d=new Date(h.timestamp);
        return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div><div style="font-weight:900;color:white;font-size:13px">${h.ticketId}</div><div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px">${h.eventTitle}</div></div>
            <div style="text-align:right"><div class="mono" style="font-size:10px;color:rgba(255,255,255,0.4)">${d.toLocaleDateString('es-CO')}</div><div class="mono" style="font-size:10px;color:rgba(255,255,255,0.4)">${d.toLocaleTimeString('es-CO')}</div></div>
          </div>
          <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
            <span style="background:#E5FF00;color:black;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900">${h.category}</span>
            <span style="background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:999px;font-size:10px">${h.attendeeName}</span>
            <span style="background:${h.wasAlreadyValidated?'rgba(255,59,48,0.2)':'rgba(0,200,83,0.2)'};color:${h.wasAlreadyValidated?'#FF3B30':'#00C853'};padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900">${h.wasAlreadyValidated?'DUPLICADO':'OK'}</span>
          </div>
          <div class="mono" style="font-size:9px;color:rgba(255,255,255,0.3);margin-top:8px">Orden: ${h.orderId} • Doc: ${h.attendeeDoc||''}</div>
        </div>`;
      }).join('');
    }
    if(statsCont){
      var hoy=new Date().toDateString();
      var hoyCount=hist.filter(function(h){ return new Date(h.timestamp).toDateString()===hoy; }).length;
      var dupCount=hist.filter(function(h){ return h.wasAlreadyValidated; }).length;
      statsCont.innerHTML=`<div class="mono text-[10px] text-white/40">ESTADÍSTICAS</div><div style="margin-top:6px;font-size:12px"><div><b style="color:white">${hist.length}</b> total validados</div><div><b style="color:#00C853">${hoyCount}</b> hoy</div><div><b style="color:#FF3B30">${dupCount}</b> duplicados detectados</div></div>`;
    }
  }

  function exportHistory(){
    var hist=window.__getValidationHistory();
    if(hist.length===0) return alert('Sin datos');
    var csv='Ticket ID,Evento,Categoria,Titular,Documento,Orden,Fecha,Hora,Estado\n';
    hist.forEach(function(h){
      var d=new Date(h.timestamp);
      csv+=`"${h.ticketId}","${h.eventTitle}","${h.category}","${h.attendeeName}","${h.attendeeDoc||''}","${h.orderId}","${d.toLocaleDateString('es-CO')}","${d.toLocaleTimeString('es-CO')}","${h.wasAlreadyValidated?'DUPLICADO':'VALIDO'}"\n`;
    });
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download='historial_validaciones_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  }

  var html5QrCode=null; var isScanning=false;
  function startScanner(){
    if(localStorage.getItem('checking_admin')!=='true'){ alert('⛔ Solo admin'); return; }
    if(html5QrCode) try{ html5QrCode.clear(); }catch(e){}
    html5QrCode=new Html5Qrcode("qr-reader");
    html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},function(txt){ handleQR(txt); },function(){}).then(function(){ isScanning=true; document.getElementById('start-scan-btn').style.display='none'; document.getElementById('stop-scan-btn').style.display='block'; }).catch(function(err){ alert('Error cámara: '+err); });
  }
  function stopScanner(){ if(html5QrCode&&isScanning){ html5QrCode.stop().then(function(){ isScanning=false; document.getElementById('start-scan-btn').style.display='block'; document.getElementById('stop-scan-btn').style.display='none'; }).catch(function(){}); } }
  function handleQR(text){
    if(!text.includes('CHECKING://TICKET')&&!text.includes('CHK-')){ showResult('❌ QR no válido','error'); return; }
    try{
      var tid=null; var tdata=null;
      var m=text.match(/CHK-[A-Z0-9\-]+/); if(m) tid=m[0];
      var dm=text.match(/[?&]d=([^&]+)/); if(dm){ try{ var js=decodeURIComponent(escape(atob(dm[1]))); tdata=JSON.parse(js); tid=tdata.id||tid; }catch(e){} }
      if(!tid){ showResult('❌ Sin ID','error'); return; }
      var tickets=JSON.parse(localStorage.getItem('checking_tickets')||'[]');
      var orders=JSON.parse(localStorage.getItem('checking_orders')||'[]');
      var ticket=tickets.find(function(t){return t.id===tid}); if(!ticket){ for(var i=0;i<orders.length;i++){ var f=(orders[i].tickets||[]).find(function(t){return t.id===tid}); if(f){ticket=f;break;} } }
      if(!ticket){ showResult(`❌ Ticket <b>${tid}</b> no encontrado<br><span style="font-size:11px;opacity:0.6">Falso o no existe</span>`, 'error'); if(navigator.vibrate) navigator.vibrate([100,50,100]); return; }
      var wasValidated=(ticket.status==='validado');
      var html=`<div style="background:${wasValidated?'rgba(255,59,48,0.15)':'rgba(0,200,83,0.15)'};border:1px solid ${wasValidated?'rgba(255,59,48,0.3)':'rgba(0,200,83,0.3)'};border-radius:12px;padding:12px">
        <div style="font-size:14px;font-weight:900;color:${wasValidated?'#FF3B30':'#00C853'}">${wasValidated?'⚠️ YA VALIDADO':'✅ VÁLIDO'}</div>
        <div style="margin-top:10px;font-size:12px;line-height:1.5">
          <div><b>ID:</b> ${ticket.id}</div><div><b>Evento:</b> ${ticket.eventTitle}</div>
          <div><b>Categoría:</b> <span style="background:#E5FF00;color:black;padding:2px 8px;border-radius:999px;font-weight:900;font-size:10px">${ticket.ticketCategory||'General'}</span></div>
          <div><b>Titular:</b> ${ticket.attendee?.name||''}</div><div><b>Doc:</b> ${ticket.attendee?.doc||''}</div>
          <div><b>Estado:</b> ${ticket.status}</div>
        </div>
        ${!wasValidated?`<button onclick="window.__validateTicket('${ticket.id}')" style="width:100%;margin-top:12px;padding:12px;border-radius:999px;background:#00C853;color:white;font-weight:900;border:none;cursor:pointer">✓ VALIDAR INGRESO</button>`:''}
      </div>`;
      showResult(html, wasValidated?'warning':'success');
      if(navigator.vibrate) navigator.vibrate(wasValidated?[100,50,100,50,100]:[200]);
    }catch(e){ showResult('Error: '+e.message,'error'); }
  }
  function showResult(html,type){
    var c=document.getElementById('qr-result'); var cc=document.getElementById('qr-result-content');
    if(c&&cc){ cc.innerHTML=html; c.style.display='block'; }
  }
  window.__validateTicket=function(tid){
    if(localStorage.getItem('checking_admin')!=='true'){ alert('⛔ Solo admin'); return; }
    if(!confirm('¿Validar ingreso '+tid+'?')) return;
    try{
      var tickets=JSON.parse(localStorage.getItem('checking_tickets')||'[]');
      var wasAlready=false;
      var ticketInfo=null;
      tickets=tickets.map(function(t){ if(t.id===tid){ wasAlready=(t.status==='validado'); ticketInfo=t; t.status='validado'; t.validatedAt=new Date().toISOString(); t.validatedBy='admin-scanner'; } return t; });
      localStorage.setItem('checking_tickets', JSON.stringify(tickets));
      var orders=JSON.parse(localStorage.getItem('checking_orders')||'[]');
      orders=orders.map(function(o){ o.tickets=(o.tickets||[]).map(function(t){ if(t.id===tid){ t.status='validado'; t.validatedAt=new Date().toISOString(); } return t; }); return o; });
      localStorage.setItem('checking_orders', JSON.stringify(orders));
      // Guardar en historial
      if(ticketInfo){
        window.__saveValidationHistory({
          ticketId: tid,
          eventTitle: ticketInfo.eventTitle||'',
          category: ticketInfo.ticketCategory||'General',
          attendeeName: ticketInfo.attendee?.name||'',
          attendeeDoc: ticketInfo.attendee?.doc||'',
          orderId: ticketInfo.orderId||'',
          timestamp: new Date().toISOString(),
          wasAlreadyValidated: wasAlready
        });
        renderHistory();
      }
      alert('✅ Ticket '+tid+' VALIDADO - Ingreso permitido');
      var c=document.getElementById('qr-result'); if(c) c.style.display='none';
    }catch(e){ alert('Error: '+e.message); }
  };

  function injectButtons(){
    if(localStorage.getItem('checking_admin')!=='true') return;
    if(!document.getElementById('admin-scanner-fab')){
      var fab=document.createElement('button'); fab.id='admin-scanner-fab';
      fab.innerHTML='📷<span style="font-size:10px;font-weight:900;margin-left:4px">SCAN</span>';
      fab.style.cssText='position:fixed;bottom:20px;right:20px;z-index:9998;width:80px;height:80px;border-radius:50%;background:#E5FF00;color:black;font-weight:900;font-size:20px;border:3px solid black;box-shadow:0 8px 24px rgba(0,0,0,0.4);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;';
      fab.onclick=function(){ 
        var modal=document.getElementById('admin-qr-scanner-modal');
        if(modal){ 
          modal.style.display='flex'; 
          renderHistory(); 
          // Redirige directo a cámara
          setTimeout(function(){ 
            var startBtn=document.getElementById('start-scan-btn');
            if(startBtn && startBtn.style.display!=='none'){
              startBtn.click();
            } else {
              // Si ya existe función global
              if(typeof startScanner==='function') startScanner();
              // Fallback: intentar iniciar directamente
              var reader=document.getElementById('qr-reader');
              if(reader && window.Html5Qrcode){
                try{
                  if(window._html5QrCodeInstance) { try{ window._html5QrCodeInstance.clear(); }catch(e){} }
                  window._html5QrCodeInstance = new Html5Qrcode("qr-reader");
                  window._html5QrCodeInstance.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:250}},function(txt){ 
                    // Reusar handleQR si existe
                    var event = new CustomEvent('qrScanned', {detail: txt});
                    document.dispatchEvent(event);
                    // Intentar llamar al handler global
                    if(window._handleQR) window._handleQR(txt);
                  },function(){}).then(function(){
                    var sBtn=document.getElementById('start-scan-btn');
                    var eBtn=document.getElementById('stop-scan-btn');
                    if(sBtn) sBtn.style.display='none';
                    if(eBtn) eBtn.style.display='block';
                  });
                }catch(e){ console.log('Auto-start error', e); }
              }
            }
          }, 400);
        } 
      };
      document.body.appendChild(fab);
    }
    if(!document.getElementById('admin-history-fab')){
      var histFab=document.createElement('button'); histFab.id='admin-history-fab';
      histFab.innerHTML='📋<span style="font-size:9px;font-weight:900;margin-top:2px">HIST</span>';
      histFab.style.cssText='position:fixed;bottom:110px;right:20px;z-index:9998;width:60px;height:60px;border-radius:50%;background:white;color:black;font-weight:900;font-size:18px;border:2px solid black;box-shadow:0 8px 24px rgba(0,0,0,0.4);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;';
      histFab.onclick=function(){ document.getElementById('admin-history-modal').style.display='flex'; renderHistory(); };
      document.body.appendChild(histFab);
    }
  }

  createModals();
  setInterval(function(){
    if(localStorage.getItem('checking_admin')==='true'){
      injectButtons();
      if(document.getElementById('admin-qr-scanner-modal')&&document.getElementById('admin-qr-scanner-modal').style.display==='flex'){
        renderHistory();
      }
    } else {
      var b=document.getElementById('admin-scanner-fab'); if(b) b.style.display='none';
      var h=document.getElementById('admin-history-fab'); if(h) h.style.display='none';
    }
  },1000);
  console.log('✅ Scanner + Historial solo admin activo');
})();
</script>

<script>
// === BOTÓN ESCANEO DIRECTO A CÁMARA ===
(function(){
  // Sobrescribir para que al abrir modal se inicie cámara automáticamente
  var originalRender = window.renderHistory;
  
  // Escuchar apertura de modal para auto-iniciar
  var observer = new MutationObserver(function(mutations){
    mutations.forEach(function(m){
      if(m.type==='attributes' && m.attributeName==='style'){
        var modal=document.getElementById('admin-qr-scanner-modal');
        if(modal && modal.style.display==='flex'){
          // Modal abierto, iniciar cámara directo
          setTimeout(function(){
            var startBtn=document.getElementById('start-scan-btn');
            if(startBtn && startBtn.style.display!=='none' && startBtn.offsetParent!==null){
              console.log('📷 Redirigiendo directo a cámara...');
              startBtn.click();
            }
          }, 500);
        }
      }
    });
  });
  
  setTimeout(function(){
    var modal=document.getElementById('admin-qr-scanner-modal');
    if(modal){
      observer.observe(modal, {attributes:true, attributeFilter:['style']});
    }
  },1000);
  
  // También hacer que el botón FAB haga redirección directa sin mostrar modal vacío
  window.__directCameraScan = function(){
    if(localStorage.getItem('checking_admin')!=='true'){
      alert('⛔ Solo administrador puede usar el escáner');
      return;
    }
    var modal=document.getElementById('admin-qr-scanner-modal');
    if(!modal) return;
    modal.style.display='flex';
    // Esperar y iniciar
    setTimeout(function(){
      var startBtn=document.getElementById('start-scan-btn');
      if(startBtn) startBtn.click();
    }, 300);
  };
  
  console.log('✅ Botón escaneo directo a cámara configurado');
})();
</script>
